reconciled: false
tags:
  - Aluminum
  - Manufacturing
  - Building Products
  - Industrial
  - FinOps
  - FOCUS
description: >-
  Arconic is a privately held industrial manufacturer (Apollo Global Management
  portfolio company). Spend settles through purchase orders, master supply
  agreements, and distributor invoices for rolled products, extrusions, Kawneer
  architectural systems, Reynobond composite panels, and CRMs reference materials —
  not via a metered API invoice. FinOps mapping is structural only.
notes: >-
  No public developer pricing — placeholder only. Costs flow through goods/services
  pricing, not a metered API line item.
sources:
  - https://www.arconic.com
  - https://www.kawneer.com
  - https://crms.arconic.com
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Arconic Corporation
serviceCategory: Industrial / Metals
billingModel:
  pricingCategory: Contract
  billingFrequency: Per-Invoice
  billingCurrency: USD
  chargeCategories:
    - Purchase
focusColumns:
  ServiceName: Arconic Products & Services
  ServiceCategory: Industrial / Metals
  ProviderName: Arconic
  PublisherName: Arconic Corporation
  InvoiceIssuerName: Arconic Corporation
  BillingCurrency: USD
meters:
  - name: customer_contract
    description: Customer / distributor relationship — not a metered unit.
    unit: contract
    aggregation: count
    dimensions:
      - customer
      - business_segment
  - name: reference_material_unit
    description: Per-item purchase of certified spectrochemical reference materials from the CRMs catalog.
    unit: item
    aggregation: count
    dimensions:
      - alloy
      - distributor
principles:
  - name: Visibility
    description: >-
      Track integration cost as part of procurement / supply-chain spend; Arconic
      does not publish a metered usage feed for catalog, order, or technical-data
      access.
  - name: Allocation
    description: >-
      Allocate spend by business segment — aerospace, automotive, commercial
      transportation, building & construction (Kawneer/Reynobond), packaging, or
      industrial — to match Arconic's product organization.
  - name: Optimization
    description: >-
      Optimize procurement by consolidating orders, negotiating volume terms, and
      coordinating Kawneer architectural specifications early in the design phase
      to avoid late-stage redesign.
  - name: Accountability
    description: >-
      Procurement and architectural/engineering leadership own the supplier
      relationship; review activity against contract terms during quarterly
      business reviews with Arconic account teams.
maintainers:
