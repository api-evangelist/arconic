  - type: Features
    data:
      - name: Rolled Aluminum Products
        description: >-
          Sheet, plate, and coil aluminum products engineered for aerospace, automotive,
          commercial transportation, packaging, and industrial customers.
      - name: Aluminum Extrusions
        description: >-
          Hard-alloy extruded shapes, seamless tube, and custom profiles for structural
          aerospace, automotive, and industrial applications.
      - name: Architectural Systems
        description: >-
          Kawneer-branded curtain walls, storefronts, entrances, and window systems
          for commercial and institutional buildings.
      - name: Composite Panels & Cladding
        description: >-
          Reynobond aluminum composite panels and Reynolux coated sheet for
          architectural facades and rainscreen cladding.
      - name: Certified Reference Materials
        description: >-
          Spectrochemical reference materials covering 340+ aluminum alloys for
          laboratory calibration and elemental analysis.
      - name: Global Manufacturing Footprint
        description: >-
          Operations across Canada, China, France, Germany, Hungary, the United
          Kingdom, and the United States.
  - type: UseCases
    data:
      - name: Aerospace Structures
        description: >-
          Aluminum sheet, plate, and extruded structural components for commercial
          and defense aircraft fuselage, wing, and airframe assemblies.
      - name: Automotive Body Sheet
        description: >-
          Lightweighting aluminum sheet for automotive body panels, closures, and
          structural components used by major OEMs.
      - name: Commercial Transportation
        description: >-
          Aluminum sheet and extrusions for tractor trailers, heavy trucks, rail,
          and other transportation equipment.
      - name: Beverage Packaging
        description: >-
          Can body stock, can end stock, and tab stock supplied to beverage and
          food packaging customers.
      - name: Commercial Building Facades
        description: >-
          Kawneer curtain wall, storefront, and window systems plus Reynobond
          composite panels installed across commercial, institutional, and
          multifamily buildings.
      - name: Industrial & Defense
        description: >-
          High-purity aluminum and specialty plate for defense, aerospace, and
          industrial applications including the recent $57.5M high-purity aluminum
          capacity expansion.
  - type: Integrations
    data:
      - name: Apollo Global Management
        description: >-
          Arconic was acquired by funds managed by Apollo Global Management in
          August 2023 for approximately $5.2 billion and is now a privately held
          Apollo portfolio company.
      - name: Alcoa Lineage
        description: >-
          Arconic was spun off from Alcoa Inc. in November 2016; the rolled products,
          extrusions, and architectural systems businesses trace their lineage to
          Alcoa's downstream operations.
      - name: Howmet Aerospace Separation
        description: >-
          In April 2020, the predecessor Arconic Inc. separated into Howmet Aerospace
          (engineered products / fastening systems) and Arconic Corporation (rolled
          products, extrusions, building & construction systems).
      - name: Kawneer Architectural Network
        description: >-
          Kawneer products reach architects and general contractors through dealer,
          glazier, and architectural representative networks across North America.
      - name: Distributor & Service Center Network
        description: >-
          Rolled products and extrusions are distributed through metal service
          centers and direct OEM supply agreements globally.
  - type: Solutions
    data:
      - name: Aerospace & Defense
        description: >-
          Aluminum plate, sheet, and extruded structural components for commercial
          aircraft, defense platforms, and space applications.
      - name: Automotive & Commercial Transportation
        description: >-
          Body sheet, structural extrusions, and heat-treated plate for passenger
          vehicles, light trucks, heavy trucks, and trailers.
      - name: Building & Construction
        description: >-
          Kawneer architectural systems, Reynobond composite panels, and Reynolux
          coated sheet for commercial buildings.
      - name: Industrial Solutions
        description: >-
          Plate, sheet, and extrusions for general industrial machinery, tooling,
          and equipment manufacturers.
      - name: Packaging
        description: >-
          Aluminum can body stock, can end stock, and tab stock for beverage and
          food packaging.
      - name: Spectrochemical Reference Materials
        description: >-
          Certified reference materials supporting elemental analysis laboratories
          across the aluminum and metals industry.
