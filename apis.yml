apis:
  - aid: arconic:arconic-rolled-products
    name: Arconic Rolled Products
    tags:
      - Aluminum
      - Rolled Products
      - Sheet
      - Plate
      - Coil
    humanURL: https://www.arconic.com
    properties:
      - url: https://www.arconic.com
        type: Documentation
    description: >-
      Rolled aluminum sheet, plate, and coil products serving aerospace, automotive,
      commercial transportation, packaging (can sheet, can end stock, tab stock), and
      industrial customers. Manufactured at integrated rolling mills including the
      Davenport, Iowa and Tennessee Operations.

  - aid: arconic:arconic-extrusions
    name: Arconic Extrusions
    tags:
      - Aluminum
      - Extrusions
      - Aerospace
      - Automotive
      - Industrial
    humanURL: https://www.arconic.com
    properties:
      - url: https://www.arconic.com
        type: Documentation
    description: >-
      Hard-alloy aluminum extrusions for aerospace structural components, automotive
      and commercial transportation parts, and industrial applications. Includes
      seamless extruded tube, structural shapes, and custom profiles produced at
      facilities in the United States and Europe.

  - aid: arconic:arconic-building-construction-systems
    name: Arconic Building & Construction Systems (Kawneer)
    tags:
      - Aluminum
      - Architectural Systems
      - Curtain Wall
      - Storefronts
      - Entrances
      - Building Products
    humanURL: https://www.kawneer.com
    properties:
      - url: https://www.kawneer.com
        type: Documentation
      - url: https://www.kawneer.com
        type: Website
    description: >-
      Kawneer-branded architectural aluminum systems for commercial buildings —
      curtain walls, window walls, storefront framing, doors and entrances,
      architectural windows, sun control, overhead glazing, hurricane-resistant
      systems, and blast-mitigating products. Markets include education, healthcare,
      government/civic, retail, multifamily residential, office, and transportation.
      Kawneer was founded in 1906 and is now part of Arconic.

  - aid: arconic:arconic-reynobond-reynolux
    name: Arconic Reynobond / Reynolux Architectural Panels
    tags:
      - Aluminum
      - Composite Panels
      - Architectural Cladding
      - Building Products
    humanURL: https://www.arconic.com
    properties:
      - url: https://www.arconic.com
        type: Documentation
    description: >-
      Reynobond aluminum composite panels (ACP) and Reynolux coated aluminum sheet
      for architectural cladding and rainscreen facade applications. Reynobond is
      offered in fire-resistant (FR / A2) and other core variants; product history
      includes the Reynobond PE cladding identified by the Grenfell Tower Inquiry
      as a major contributor to the 2017 fire.

  - aid: arconic:arconic-spectrochemical-reference-materials
    name: Arconic Spectrochemical Certified Reference Materials
    tags:
      - Aluminum
      - Reference Materials
      - Metrology
      - Laboratory
      - Quality
    humanURL: https://crms.arconic.com
    properties:
      - url: https://crms.arconic.com
        type: Documentation
      - url: https://crms.arconic.com
        type: Portal
    description: >-
      Catalog of more than 340 certified spectrochemical reference materials covering
      aluminum alloys for elemental analysis and laboratory calibration. Functions
      as a digital catalog and quoting portal; orders are placed through Arconic
      sales, authorized distributors, or Amazon. No public REST API.

