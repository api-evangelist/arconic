description: >-
  Arconic Corporation is an aluminum solutions company producing rolled aluminum sheet
  and plate, extrusions, and architectural building products for the aerospace, automotive,
  commercial transportation, building & construction, industrial, and packaging markets.
  Spun off from Alcoa in 2016, separated from Howmet Aerospace in 2020, and acquired
  by Apollo Global Management in August 2023 for approximately $5.2 billion, Arconic
  now operates as a private company headquartered in Pittsburgh, Pennsylvania. Key
  brands include Kawneer architectural systems and Reynobond aluminum composite panels.
